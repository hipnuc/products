# canhost configuration (SocketCAN).
#
# Loaded from the first of: $CANHOST_CONF, ./canhost.ini, ~/.canhost.ini,
# /etc/canhost.ini. The bus bitrate is set with `ip link`, not here.
# PGN and signal definitions: the J1939 DBC file in this repository

# SocketCAN interface name
interface=can0

# Target node(s): J1939 source address, comma separated for several devices
# node_id=8,9,10
node_id=8

# Host source address used in configuration frames
sync.sa=0x55

# CAN FD: enable FD frames on the socket (needed for CANFD83, PGN 0xFF5B)
canfd=1
canfd.brs=1
canfd.data_bitrate=4000000

# sync.<pgn>=<period_ms>: PGNs sent by `canhost trigger sync`
sync.0xff34=100   # acceleration
sync.0xff37=100   # angular rate
sync.0xff3d=100   # roll / pitch
sync.0xff41=100   # yaw
sync.0xff46=100   # quaternion
# sync.0xff5b=100 # CANFD83 (CAN FD only)
