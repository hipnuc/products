name: python-sdk

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
          - os: ubuntu-26.04
            python: '3.14'
          - os: ubuntu-24.04-arm
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install from source
        run: python -m pip install "./python[can]"
      - name: Check installed SDK
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -m pip check
          python -c "import hipnuc, hipnuc.can, can; print(hipnuc.__version__, hipnuc.__file__)"
          hihost --version
          hihost --help
          hihost can --help
          python -m hipnuc --version
          python -m hipnuc --help
          python -m hipnuc can --help
      - name: Lint
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: |
          python -m pip install "ruff>=0.11,<1"
          python -m ruff check python
          python -m ruff format --check --quiet python

  ubuntu-system-python:
    # Exercise the customer quick start with Ubuntu 22.04's system Python.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install with Ubuntu 22.04 system Python
        working-directory: python
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv
          /usr/bin/python3 --version
          /usr/bin/python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install .
          hihost --version
          hihost --help
          python -m hipnuc --version
          python -m hipnuc --help
      - name: Verify in a fresh shell
        working-directory: python
        run: |
          source .venv/bin/activate
          python -m pip check
          cd "$RUNNER_TEMP"
          python -c "import hipnuc; print(hipnuc.__version__, hipnuc.__file__)"
          hihost --version
          hihost --help
          python -m hipnuc --version
          python -m hipnuc --help

  armv7:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: ARMv7 Linux source installation (emulated)
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/sdk:ro" -w /tmp arm32v7/python:3.11-slim-bookworm sh -c '
            cp -R /sdk/python /tmp/hipnuc &&
            python -m pip install --upgrade pip &&
            python -m pip install "/tmp/hipnuc[can]" &&
            python -m pip check &&
            python -c "import hipnuc, hipnuc.can, can; print(hipnuc.__version__, hipnuc.__file__)" &&
            hihost --version &&
            hihost --help &&
            hihost can --help &&
            python -m hipnuc --version &&
            python -m hipnuc --help &&
            python -m hipnuc can --help'
