name: python-sdk

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - {os: macos-latest, python: '3.10'}
          - {os: macos-latest, python: '3.11'}
          - {os: macos-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from source
        run: python -m pip install ./python "pytest>=8,<10"
      - name: Test installed SDK
        run: |
          python -m pytest python/tests -q
          python python/tools/check_install.py

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build source package and its wheel
        # The default build first creates an sdist, then builds its wheel.
        run: |
          python -m pip install "build>=1,<2" "ruff>=0.11,<1"
          python -m build python
      - name: Check source package contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          with tarfile.open(next(Path('python/dist').glob('*.tar.gz'))) as archive:
              paths = {Path(*Path(name).parts[1:]) for name in archive.getnames()}
          examples = {path.name for path in paths if path.parent == Path('examples')}
          assert examples == {
              'read_samples.py', 'record_samples.py',
              'send_commands.py', 'modbus_multinode.py',
          }, examples
          for directory in ('docs', 'tests', 'tools'):
              assert any(path.parts and path.parts[0] == directory for path in paths), directory
          assert Path('tools/check_install.py') in paths
          PY
      - name: Check installed wheel and source style
        run: |
          python -m pip install python/dist/*.whl
          python python/tools/check_install.py
          python -m ruff check python
          python -m ruff format --check --quiet python

  ubuntu-system-python:
    # Validate the same interpreter/venv path used in the customer quick start.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install with Ubuntu 22.04 system Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          /usr/bin/python3 -c "import sys; assert sys.version_info[:2] == (3, 10), sys.version"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/hipnuc-system-python"
          "$RUNNER_TEMP/hipnuc-system-python/bin/python" -m pip install ./python "pytest>=8,<10"
          "$RUNNER_TEMP/hipnuc-system-python/bin/python" -m pytest python/tests -q
          "$RUNNER_TEMP/hipnuc-system-python/bin/python" python/tools/check_install.py

  debian-arm:
    # Exercises Debian user space on ARM, not Pi UART hardware or its kernel.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm64, linux/arm/v7]
        image: ['python:3.10-bookworm', 'python:3.11-bookworm', 'python:3.13-trixie']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Install from source and test in ARM container
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform "$TEST_PLATFORM" -v "$GITHUB_WORKSPACE:/work" -w /work "$TEST_IMAGE" sh -ec '
            python -m pip install ./python "pytest>=8,<10"
            python -m pytest python/tests -q
            python python/tools/check_install.py
          '
